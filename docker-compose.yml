# Development and test services. `docker compose up -d`
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: cslug, POSTGRES_PASSWORD: cslug, POSTGRES_DB: cslug }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  minio: # S3 for the storage tests: S3_ENDPOINT=http://localhost:9000, create the bucket "cslug" in the console (:9001)
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: cslug, MINIO_ROOT_PASSWORD: cslug-secret }
    ports: ["9000:9000", "9001:9001"]
