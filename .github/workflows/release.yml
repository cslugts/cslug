name: Release

# Publishes every @cslug/* package at the tagged version, in dependency order.
# Uses npm trusted publishing (OIDC) with provenance: no npm token is stored in the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # same services as ci.yml: the release runs the full check, database and Redis tests included
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cslug, POSTGRES_PASSWORD: cslug, POSTGRES_DB: cslug }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cslug" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://cslug:cslug@localhost:5432/cslug
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: cslug
      S3_ACCESS_KEY_ID: cslug
      S3_SECRET_ACCESS_KEY: cslug-secret
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      # MinIO for the S3 disk tests (a service container cannot be given `server /data`)
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=cslug -e MINIO_ROOT_PASSWORD=cslug-secret \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 cslug cslug-secret && mc mb local/cslug"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Tag matches package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in packages/*/package.json; do
            grep -q "\"version\": \"$v\"" "$f" || { echo "$f is not at $v"; exit 1; }
          done
      - run: bun scripts/release.ts publish
