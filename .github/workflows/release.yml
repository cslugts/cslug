name: Release

# Publishes every @cslug/* package at the tagged version, in dependency order.
# Uses npm trusted publishing (OIDC) with provenance: no npm token is stored in the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # same services as ci.yml: the release runs the full check, database and Redis tests included
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cslug, POSTGRES_PASSWORD: cslug, POSTGRES_DB: cslug }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cslug" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cslug:cslug@localhost:5432/cslug
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Tag matches package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in packages/*/package.json; do
            grep -q "\"version\": \"$v\"" "$f" || { echo "$f is not at $v"; exit 1; }
          done
      - run: bun scripts/release.ts publish
