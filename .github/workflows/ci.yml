name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cslug, POSTGRES_PASSWORD: cslug, POSTGRES_DB: cslug }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cslug" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://cslug:cslug@localhost:5432/cslug
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: cslug
      S3_ACCESS_KEY_ID: cslug
      S3_SECRET_ACCESS_KEY: cslug-secret
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # RustFS (S3-compatible, checks signatures) for the S3 disk tests; started here, since a service container
      # cannot be given its arguments. The bucket is created with a SigV4-signed PUT.
      - name: Start S3 (RustFS)
        run: |
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=cslug -e RUSTFS_SECRET_KEY=cslug-secret \
            rustfs/rustfs:1.0.5 /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && break; sleep 1; done
          curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user cslug:cslug-secret http://localhost:9000/cslug
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:graph
      - run: bun run test
      - run: bun run check:starter
