# Development services: `docker compose up -d`
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: cslug, POSTGRES_PASSWORD: cslug, POSTGRES_DB: {{db}} }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
